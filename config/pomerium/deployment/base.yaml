apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomerium
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pomerium
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: pomerium
          lifecycle:
            preStop:
              exec:
                command:
                  - /busybox/sleep
                  - "30"
      serviceAccountName: pomerium-controller
      terminationGracePeriodSeconds: 60
