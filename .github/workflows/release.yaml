name: Release
run-name: candidate ${{ inputs.version }} ${{ inputs.request }}
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      request:
        required: true
        type: string

concurrency:
  group: candidate-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      CORE_SHA: ${{ inputs.core_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-0" ]]
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Pin core and image
        run: |
          go get "github.com/pomerium/pomerium@$CORE_SHA" "github.com/pomerium/pomerium/pkg/grpc/config@$CORE_SHA" "github.com/pomerium/pomerium/pkg/grpc/databroker@$CORE_SHA"
          go mod tidy
          yq -i '.spec.template.spec.containers[0].image = "pomerium/ingress-controller:" + strenv(VERSION)' config/pomerium/deployment/image.yaml

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "prepare for $VERSION release"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$GITHUB_REF"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          context: git
          images: |
            us-central1-docker.pkg.dev/pomerium-public-prd/ingress-controller/ingress-controller
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}},value=${{ inputs.version }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: gcloud authenticate
        id: gcloud-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ secrets.GCP_PRODUCTION_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          skip_install: true

      - name: gcloud auth configure-docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build
        run: make build-ci POMERIUM_VERSION="$VERSION"

      - name: Docker Publish - Main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id')
          for id in $drafts; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          previous=()
          if [[ $VERSION =~ ^v([0-9]+)\.([1-9][0-9]*)\.0$ ]]; then
            previous=(--notes-start-tag "v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] - 1)).0")
          fi
          gh release create "$VERSION" --draft --generate-notes --target "$(git rev-parse HEAD)" "${previous[@]}"
