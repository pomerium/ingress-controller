apiVersion: v1
kind: Service
metadata:
  name: pomerium-headless
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: proxy
spec:
  publishNotReadyAddresses: true
  clusterIP: None
  ports:
    - name: enterprise
      port: 8701
    - name: grpc
      port: 5443
    - name: raft
      port: 5999
  selector:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: proxy
