metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: pomeriumservices.ingress.pomerium.io
spec:
  group: ingress.pomerium.io
  names:
    kind: PomeriumService
    listKind: PomeriumServiceList
    plural: pomeriumservices
    singular: pomeriumservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
