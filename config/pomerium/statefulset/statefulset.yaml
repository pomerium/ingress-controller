apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pomerium
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: proxy
spec:
  serviceName: pomerium-proxy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pomerium
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: pomerium-controller
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: pomerium
          image: pomerium/ingress-controller:main
          imagePullPolicy: Always
          args:
            - all-in-one
            - --pomerium-config=global
            - --update-status-from-service=$(POMERIUM_NAMESPACE)/pomerium-proxy
            - --metrics-bind-address=$(POD_IP):9090
            - --health-probe-bind-address=$(POD_IP):28080
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
            - name: POMERIUM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8443
              name: quic
              protocol: UDP
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: 5000m
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          startupProbe:
            httpGet:
              path: /startupz
              port: 28080
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 28080
            initialDelaySeconds: 15
            periodSeconds: 60
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 28080
            initialDelaySeconds: 15
            periodSeconds: 60
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
